# Example Kubernetes Secret for ActionMindAI
# DO NOT commit this file to version control with actual values!
#
# Usage:
#   1. Copy this file and replace placeholder values
#   2. Apply: kubectl apply -f k8s/secrets.yaml
#
# Or use kubectl create secret command:
#   kubectl create secret generic actionmindai-secrets \\
#     --from-literal=databaseUrl='postgresql://postgres:your-password@postgres:5432/actionmindai' \\
#     --from-literal=openaiApiKey='sk-your-key-here' \\
#     --from-literal=betterAuthSecret='your-secret-at-least-32-characters' \\
#     --from-literal=postgres-user='postgres' \\
#     --from-literal=postgres-password='your-postgres-password' \\
#     -n actionmindai

---
apiVersion: v1
kind: Secret
metadata:
  name: actionmindai-secrets
  namespace: actionmindai
  labels:
    app.kubernetes.io/name: actionmindai
type: Opaque
stringData:
  # Database connection string
  # Format: postgresql://user:password@host:port/database
  # For PostgreSQL in the same cluster: postgresql://postgres:password@postgres:5432/actionmindai
  # For external databases (e.g., Neon, AWS RDS): use the provided connection string
  databaseUrl: "postgresql://postgres:CHANGE_THIS_PASSWORD@postgres:5432/actionmindai"

  # OpenAI API key for LLM functionality
  # Get your key from: https://platform.openai.com/api-keys
  openaiApiKey: "sk-CHANGE_THIS_TO_YOUR_OPENAI_KEY"

  # Secret key for Better Auth session management
  # Generate with: openssl rand -base64 32
  # Minimum 32 characters required
  betterAuthSecret: "CHANGE_THIS_TO_A_RANDOM_SECRET_AT_LEAST_32_CHARACTERS_LONG"

  # PostgreSQL user (for database initialization)
  postgres-user: "postgres"

  # PostgreSQL password (for database initialization)
  # Generate with: openssl rand -base64 16
  postgres-password: "CHANGE_THIS_TO_A_SECURE_POSTGRES_PASSWORD"

---
