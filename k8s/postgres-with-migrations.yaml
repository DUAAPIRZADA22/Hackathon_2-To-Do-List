# Complete PostgreSQL Deployment with Migrations for ActionMindAI
# This manifest includes:
#   - PostgreSQL StatefulSet
#   - PostgreSQL Service
#   - Database Migrations Job
#
# Usage:
#   1. Create secrets first (see secrets-example.yaml)
#   2. Apply this manifest: kubectl apply -f k8s/postgres-with-migrations.yaml

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: actionmindai
  labels:
    app: postgres
data:
  # PostgreSQL initialization script
  init.sql: |
    -- Create the application database
    CREATE DATABASE IF NOT EXISTS actionmindai;

    -- Connect to the database and create extensions
    \c actionmindai;

    -- Enable UUID extension (required by migrations)
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    -- Enable pgcrypto for additional security features
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: actionmindai
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # For Minikube/local development, use storageClass: standard
  # For production, use your cloud provider's storageClass
  storageClassName: standard

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: actionmindai
  labels:
    app: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: actionmindai
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: actionmindai-secrets
              key: postgres-user
          optional: true
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: actionmindai-secrets
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: init-script
        configMap:
          name: postgres-config
      # Uncomment for ephemeral storage (not recommended for production)
      # - name: postgres-data
      #   emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: standard

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: actionmindai
  labels:
    app: postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: actionmindai-migrations
  namespace: actionmindai
  labels:
    app.kubernetes.io/name: actionmindai
    app.kubernetes.io/component: migration
data:
  "001_create_tasks_conversations_messages.sql": |
    CREATE TABLE IF NOT EXISTS tasks (
        id SERIAL PRIMARY KEY,
        user_id VARCHAR(255) NOT NULL,
        title VARCHAR(255) NOT NULL,
        description TEXT,
        completed BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        CONSTRAINT tasks_title_not_empty CHECK (LENGTH(TRIM(title)) > 0)
    );

    CREATE INDEX IF NOT EXISTS idx_tasks_user_id ON tasks(user_id);
    CREATE INDEX IF NOT EXISTS idx_tasks_user_completed ON tasks(user_id, completed);
    CREATE INDEX IF NOT EXISTS idx_tasks_user_created ON tasks(user_id, created_at DESC);

    CREATE TABLE IF NOT EXISTS conversations (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id VARCHAR(255) NOT NULL,
        title VARCHAR(255),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_conversations_user_id ON conversations(user_id);
    CREATE INDEX IF NOT EXISTS idx_conversations_user_created ON conversations(user_id, created_at DESC);

    CREATE TABLE IF NOT EXISTS messages (
        id SERIAL PRIMARY KEY,
        conversation_id UUID NOT NULL,
        user_id VARCHAR(255) NOT NULL,
        role VARCHAR(20) NOT NULL,
        content TEXT NOT NULL,
        tool_calls JSONB,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        CONSTRAINT messages_role_valid CHECK (role IN ('user', 'assistant', 'system')),
        CONSTRAINT messages_content_not_empty CHECK (LENGTH(TRIM(content)) > 0),
        CONSTRAINT messages_conversation_fkey FOREIGN KEY (conversation_id)
            REFERENCES conversations(id) ON DELETE CASCADE
    );

    CREATE INDEX IF NOT EXISTS idx_messages_conversation_id ON messages(conversation_id);
    CREATE INDEX IF NOT EXISTS idx_messages_user_id ON messages(user_id);
    CREATE INDEX IF NOT EXISTS idx_messages_conv_created ON messages(conversation_id, created_at ASC);

    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS update_tasks_updated_at ON tasks;
    CREATE TRIGGER update_tasks_updated_at BEFORE UPDATE ON tasks FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

    DROP TRIGGER IF EXISTS update_conversations_updated_at ON conversations;
    CREATE TRIGGER update_conversations_updated_at BEFORE UPDATE ON conversations FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

  "002_add_conversation_title.sql": |
    ALTER TABLE conversations ADD COLUMN IF NOT EXISTS title VARCHAR(255);
    CREATE INDEX IF NOT EXISTS idx_conversations_user_title ON conversations(user_id, title);

  "003_fix_uuid_to_varchar.sql": |
    SELECT 'Migration 003: No changes needed' AS status;

  "004_fix_user_id_types.sql": |
    ALTER TABLE tasks ALTER COLUMN user_id TYPE VARCHAR(255);
    ALTER TABLE conversations ALTER COLUMN user_id TYPE VARCHAR(255);
    ALTER TABLE messages ALTER COLUMN user_id TYPE VARCHAR(255);

---
apiVersion: batch/v1
kind: Job
metadata:
  name: actionmindai-db-migrate
  namespace: actionmindai
  labels:
    app.kubernetes.io/name: actionmindai
    app.kubernetes.io/component: migration
  annotations:
    # This ensures the job runs after PostgreSQL is ready
    # "helm.sh/hook": post-install,post-upgrade
    # "helm.sh/hook-weight": "-5"
    # "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: actionmindai-db-migrate
      labels:
        app.kubernetes.io/name: actionmindai
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      backoffLimit: 4
      activeDeadlineSeconds: 600

      initContainers:
      - name: wait-for-db
        image: postgres:16-alpine
        env:
        - name: PGHOST
          value: postgres
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: actionmindai
        command:
          - sh
          - -c
          - |
            echo "Waiting for database to be ready..."
            until pg_isready -h $PGHOST -p $PGPORT -d $PGDATABASE; do
              echo "Database not ready yet, waiting..."
              sleep 5
            done
            echo "Database is ready!"

            # Additional check for database to accept connections
            until psql "postgresql://postgres:postgres@postgres:5432/actionmindai" -c "SELECT 1" > /dev/null 2>&1; do
              echo "Database not accepting connections yet, waiting..."
              sleep 5
            done
            echo "Database is accepting connections!"

      containers:
      - name: migrate
        image: postgres:16-alpine
        command:
          - sh
          - -c
          - |
            echo "Starting database migrations..."

            MIGRATIONS_DIR="/migrations"
            APPLIED_MIGRATIONS_TABLE="schema_migrations"

            # Create migrations tracking table
            echo "Creating migrations tracking table..."
            psql "$DATABASE_URL" <<EOF
            CREATE TABLE IF NOT EXISTS $APPLIED_MIGRATIONS_TABLE (
              id SERIAL PRIMARY KEY,
              migration_name VARCHAR(255) NOT NULL UNIQUE,
              applied_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
            );
EOF

            # Get and sort migration files
            MIGRATION_FILES=$(ls -1 $MIGRATIONS_DIR/*.sql 2>/dev/null | sort)

            if [ -z "$MIGRATION_FILES" ]; then
              echo "No migration files found"
              exit 0
            fi

            echo "Found migrations:"
            echo "$MIGRATION_FILES"
            echo ""

            # Apply each migration
            for migration in $MIGRATION_FILES; do
              migration_name=$(basename "$migration")

              # Check if already applied
              applied=$(psql "$DATABASE_URL" -tAc "SELECT EXISTS(SELECT 1 FROM $APPLIED_MIGRATIONS_TABLE WHERE migration_name = '$migration_name')")

              if [ "$applied" = "t" ]; then
                echo "✓ $migration_name already applied, skipping"
              else
                echo "→ Applying $migration_name..."

                if psql "$DATABASE_URL" -f "$migration" > /tmp/migration_output.txt 2>&1; then
                  echo "✓ Successfully applied $migration_name"
                  psql "$DATABASE_URL" -c "INSERT INTO $APPLIED_MIGRATIONS_TABLE (migration_name) VALUES ('$migration_name')"
                else
                  echo "✗ Failed to apply $migration_name"
                  cat /tmp/migration_output.txt
                  exit 1
                fi
              fi
            done

            echo ""
            echo "=========================================="
            echo "All migrations completed successfully!"
            echo "=========================================="

            # Show applied migrations
            echo ""
            echo "Applied migrations:"
            psql "$DATABASE_URL" -c "SELECT migration_name, applied_at FROM $APPLIED_MIGRATIONS_TABLE ORDER BY applied_at;"
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: actionmindai-secrets
              key: databaseUrl
        - name: PGCONNECT_TIMEOUT
          value: "30"
        volumeMounts:
        - name: migrations
          mountPath: /migrations
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: migrations
        configMap:
          name: actionmindai-migrations
          defaultMode: 0444
      - name: tmp
        emptyDir: {}
