[pytest]
# Pytest configuration for Todo AI Chatbot backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Async test configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    contract: Contract tests (API schemas)
    slow: Slow-running tests

# Timeout
timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
