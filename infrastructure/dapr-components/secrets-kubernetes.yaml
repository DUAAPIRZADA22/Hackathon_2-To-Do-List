# Dapr Kubernetes Secret Store Component
# This component enables reading secrets from Kubernetes secrets
apiVersion: dapr.io/v1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: default
spec:
  type: secretstores.kubernetes
  version: v1
  metadata:
    # Kubernetes secret store configuration
    - name: kubeconfig
      value: ""
    # Namespace for secrets
    - name: namespace
      value: ""
scopes:
  - backend
  - recurring-task-service
  - notification-service
  - realtime-sync-service
