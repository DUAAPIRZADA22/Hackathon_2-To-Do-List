# Redpanda Single-Node Cluster for Minikube
# Lightweight Kafka alternative for local development
apiVersion: v1
kind: Namespace
metadata:
  name: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-config
  namespace: default
data:
  redpanda.yaml: |
    redpanda:
      developer_mode: true
      data_directory: /var/lib/redpanda/data
      seed_servers: []
    rpc_server:
      address: "0.0.0.0"
      port: 33145
    admin:
      address: "0.0.0.0"
      port: 9644
    kafka_api:
      address: "0.0.0.0"
      port: 9092
    advertised_kafka_api:
      address: redpanda.default.svc.cluster.local
      port: 9092
    pandaproxy:
      address: "0.0.0.0"
      port: 8082
    advertised_pandaproxy:
      address: redpanda.default.svc.cluster.local
      port: 8082
    schema_registry:
      address: "0.0.0.0"
      port: 8081
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: default
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 9644
          name: admin
        - containerPort: 8082
          name: pandaproxy
        - containerPort: 8081
          name: schema-registry
        volumeMounts:
        - name: data
          mountPath: /var/lib/redpanda/data
        - name: config
          mountPath: /etc/redpanda
        command:
        - /bin/bash
        - -c
        - |
          set -e
          cp /etc/redpanda-config/redpanda.yaml /etc/redpanda/redpanda.yaml
          redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M --node-id 0 --check=false
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: redpanda-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: default
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: redpanda
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
  - name: admin
    port: 9644
    targetPort: 9644
  - name: pandaproxy
    port: 8082
    targetPort: 8082
  - name: schema-registry
    port: 8081
    targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-external
  namespace: default
spec:
  type: NodePort
  selector:
    app: redpanda
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
    nodePort: 30092
  - name: admin
    port: 9644
    targetPort: 9644
    nodePort: 30644
