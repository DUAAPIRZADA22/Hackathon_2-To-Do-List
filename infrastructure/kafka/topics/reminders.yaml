# Kafka Topic: Reminders
# Events for due date reminders
apiVersion: kafka.redpanda.com/v1alpha1
kind: Topic
metadata:
  name: reminders
  namespace: default
spec:
  topicName: reminders
  partitions: 1
  replicationFactor: 1
  config:
    # Retention: 24 hours (reminders are time-sensitive)
    retention.ms: "86400000"
    # Segment size: 50MB
    segment.bytes: "52428800"
    # Cleanup policy: delete
    cleanup.policy: "delete"
    # Compression type: snappy
    compression.type: "snappy"
