# ActionMindAI Secrets Configuration for Minikube
# IMPORTANT: Fill in your actual values below
# WARNING: Never commit actual secrets to git!

secrets:
  # Database Connection String (Neon PostgreSQL)
  # Get your free database at: https://neon.tech
  databaseUrl: "postgresql+asyncpg://user:password@ep-xxx.region.aws.neon.tech/neondb?sslmode=require"

  # OpenAI API Key
  # Get your key at: https://platform.openai.com/api-keys
  openaiApiKey: "sk-your-openai-api-key-here"

  # Better Auth Secret (for session encryption)
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  betterAuthSecret: "change-this-to-a-random-secret-key"
