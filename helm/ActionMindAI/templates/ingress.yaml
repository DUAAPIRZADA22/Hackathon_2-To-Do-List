apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ActionMindAI.fullname" . }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ActionMindAI.labels" . | nindent 4 }}
  annotations:
    # Use nginx ingress class
    kubernetes.io/ingress.class: nginx
    # Enable TLS termination
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Security headers
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # CORS headers (adjust as needed)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    # Proxy settings
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # WebSocket support for SSE
    nginx.ingress.kubernetes.io/websocket-services: "{{ .Values.backend.name }}"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ include "ActionMindAI.fullname" . }}-tls
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      # Frontend routes (all non-API requests)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.frontend.name }}
            port:
              number: {{ .Values.frontend.service.port }}
      # Backend API routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.backend.name }}
            port:
              number: {{ .Values.backend.service.port }}
      # Health check endpoint
      - path: /health
        pathType: Exact
        backend:
          service:
            name: {{ .Values.backend.name }}
            port:
              number: {{ .Values.backend.service.port }}
