# Security Context for ActionMind AI pods
# Applied at deployment level for OKE compatibility

# Backend security context (uses non-root user from Dockerfile)
apiVersion: v1
kind: Pod
metadata:
  name: backend-security-policy
  namespace: {{ .Values.namespace | default "default" }}
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: backend
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false  # Python needs write access for some libs
      capabilities:
        drop:
        - ALL
    resources:
      limits:
        cpu: "1"
        memory: "1Gi"
      requests:
        cpu: "200m"
        memory: "256Mi"
