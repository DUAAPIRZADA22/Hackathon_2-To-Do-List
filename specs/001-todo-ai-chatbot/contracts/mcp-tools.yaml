## update_task

**Description**: Update task title or description

**Parameters**:

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "title": "update_task",
  "description": "Update task title or description",
  "required": ["user_id", "task_id"],
  "properties": {
    "user_id": {
      "type": "string",
      "description": "Unique identifier of the user"
    },
    "task_id": {
      "type": "integer",
      "description": "ID of the task to update"
    },
    "title": {
      "type": "string",
      "minLength": 1,
      "maxLength": 255,
      "description": "New task title (optional)"
    },
    "description": {
      "type": "string",
      "description": "New task description (optional, append or replace)"
    }
  },
  "anyOf": [
    {"required": ["title"]},
    {"required": ["description"]}
  ]
}
```

**Response**:

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "title": "update_task_response",
  "required": ["task_id", "updated", "updated_at"],
  "properties": {
    "task_id": {
      "type": "integer",
      "description": "ID of the updated task"
    },
    "title": {
      "type": ["string", "null"],
      "description": "New title if updated, otherwise null"
    },
    "description": {
      "type": ["string", "null"],
      "description": "New description if updated, otherwise null"
    },
    "completed": {
      "type": "boolean",
      "description": "Task completion status"
    },
    "updated": {
      "type": "boolean",
      "description": "Will always be true after successful update"
    },
    "updated_at": {
      "type": "string",
      "format": "date-time",
      "description": "ISO 8601 timestamp of update"
    }
  }
}
```

**Errors**:
- `TaskNotFoundError`: Task does not exist or belongs to different user
- `ValidationError`: Neither title nor description provided
- `AuthenticationError`: Invalid user_id

