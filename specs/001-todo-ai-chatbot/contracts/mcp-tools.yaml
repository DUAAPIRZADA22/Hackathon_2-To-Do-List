## Common Error Responses

All MCP tools may return these common errors:

```json
{
  "type": "object",
  "title": "error_response",
  "required": ["error", "message"],
  "properties": {
    "error": {
      "type": "string",
      "enum": [
        "ValidationError",
        "AuthenticationError",
        "TaskNotFoundError",
        "DatabaseError",
        "InternalError"
      ]
    },
    "message": {
      "type": "string",
      "description": "User-friendly error message"
    },
    "details": {
      "type": "object",
      "description": "Additional error details (optional)"
    }
  }
}
```

---

## MCP Tool Registration

All tools are registered with the MCP server using this pattern:

```python
from mcp import mcp_tool

@mcp_tool
async def add_task(user_id: str, title: str, description: str | None = None) -> dict:
    """Create a new task for a user."""
    # Implementation
    pass

@mcp_tool
async def list_tasks(user_id: str, status: str = "all") -> dict:
    """List tasks for a user with optional status filter."""
    # Implementation
    pass

# ... (other tools)
```

---

