## delete_task

**Description**: Delete a task permanently

**Parameters**:

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "title": "delete_task",
  "description": "Delete a task permanently",
  "required": ["user_id", "task_id"],
  "properties": {
    "user_id": {
      "type": "string",
      "description": "Unique identifier of the user"
    },
    "task_id": {
      "type": "integer",
      "description": "ID of the task to delete"
    }
  }
}
```

**Response**:

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "title": "delete_task_response",
  "required": ["task_id", "deleted"],
  "properties": {
    "task_id": {
      "type": "integer",
      "description": "ID of the deleted task"
    },
    "title": {
      "type": "string",
      "description": "Task title (for confirmation)"
    },
    "deleted": {
      "type": "boolean",
      "description": "Will always be true after successful deletion"
    }
  }
}
```

**Errors**:
- `TaskNotFoundError`: Task does not exist or belongs to different user
- `AuthenticationError`: Invalid user_id

