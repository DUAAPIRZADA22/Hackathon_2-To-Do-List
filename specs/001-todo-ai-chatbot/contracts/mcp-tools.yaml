# MCP Tool Schemas

**Feature**: 001-todo-ai-chatbot
**Version**: 1.0.0
**Date**: 2025-01-09

This document defines the JSON Schema for all 5 MCP tools used in the Todo AI Chatbot feature.

---

## add_task

**Description**: Create a new task for a user

**Parameters**:

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "title": "add_task",
  "description": "Create a new task for a user",
  "required": ["user_id", "title"],
  "properties": {
    "user_id": {
      "type": "string",
      "description": "Unique identifier of the user who owns this task"
    },
    "title": {
      "type": "string",
      "minLength": 1,
      "maxLength": 255,
      "description": "Task title (brief, actionable)"
    },
    "description": {
      "type": "string",
      "description": "Optional detailed description or notes"
    }
  }
}
```

**Response**:

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "title": "add_task_response",
  "required": ["task_id", "user_id", "title", "completed", "created_at"],
  "properties": {
    "task_id": {
      "type": "integer",
      "description": "ID of the created task"
    },
    "user_id": {
      "type": "string",
      "description": "User who owns this task"
    },
    "title": {
      "type": "string",
      "description": "Task title"
    },
    "description": {
      "type": ["string", "null"],
      "description": "Task description or null if not provided"
    },
    "completed": {
      "type": "boolean",
      "description": "Whether the task is completed (always false on creation)"
    },
    "created_at": {
      "type": "string",
      "format": "date-time",
      "description": "ISO 8601 timestamp of task creation"
    }
  }
}
```

**Errors**:
- `ValidationError`: Invalid title (empty or too long)
- `AuthenticationError`: Invalid user_id

---

## list_tasks

**Description**: List tasks for a user with optional status filter

**Parameters**:

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "title": "list_tasks",
  "description": "List tasks for a user with optional status filter",
  "required": ["user_id"],
  "properties": {
    "user_id": {
      "type": "string",
      "description": "Unique identifier of the user"
    },
    "status": {
      "type": "string",
      "enum": ["all", "pending", "completed"],
      "default": "all",
      "description": "Filter tasks by status"
    }
  }
}
```

**Response**:

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "title": "list_tasks_response",
  "required": ["tasks", "count"],
  "properties": {
    "tasks": {
      "type": "array",
      "description": "List of tasks matching the filter",
      "items": {
        "type": "object",
        "required": ["task_id", "title", "completed", "created_at"],
        "properties": {
          "task_id": {
            "type": "integer"
          },
          "title": {
            "type": "string"
          },
          "description": {
            "type": ["string", "null"]
          },
          "completed": {
            "type": "boolean"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      }
    },
    "count": {
      "type": "integer",
      "description": "Total number of tasks returned"
    }
  }
}
```

**Errors**:
- `AuthenticationError`: Invalid user_id

---

## complete_task

**Description**: Mark a task as completed

**Parameters**:

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "title": "complete_task",
  "description": "Mark a task as completed",
  "required": ["user_id", "task_id"],
  "properties": {
    "user_id": {
      "type": "string",
      "description": "Unique identifier of the user"
    },
    "task_id": {
      "type": "integer",
      "description": "ID of the task to complete"
    }
  }
}
```

**Response**:

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "title": "complete_task_response",
  "required": ["task_id", "completed", "updated_at"],
  "properties": {
    "task_id": {
      "type": "integer",
      "description": "ID of the completed task"
    },
    "title": {
      "type": "string",
      "description": "Task title (for confirmation)"
    },
    "completed": {
      "type": "boolean",
      "description": "Will always be true after successful completion"
    },
    "updated_at": {
      "type": "string",
      "format": "date-time",
      "description": "ISO 8601 timestamp of completion"
    }
  }
}
```

**Errors**:
- `TaskNotFoundError`: Task does not exist or belongs to different user
- `AuthenticationError`: Invalid user_id

