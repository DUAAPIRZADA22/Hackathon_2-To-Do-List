# Database Schema (DDL)

**Feature**: 002-todo-ai-chatbot
**Database**: PostgreSQL 16+ (Neon Serverless)
**ORM**: SQLModel 0.0.22+

## Schema DDL

```sql
-- ============================================================
-- Users Table
-- ============================================================
CREATE TABLE users (
    id VARCHAR(255) PRIMARY KEY,
    email VARCHAR(255) UNIQUE NOT NULL,
    name VARCHAR(255),
    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
    updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

CREATE INDEX idx_users_email ON users(email);

-- ============================================================
-- Tasks Table
-- ============================================================
CREATE TABLE tasks (
    id VARCHAR(255) PRIMARY KEY,
    user_id VARCHAR(255) NOT NULL REFERENCES users(id) ON DELETE CASCADE,
    title VARCHAR(500) NOT NULL,
    description TEXT,
    completed BOOLEAN DEFAULT FALSE,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
    updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

CREATE INDEX idx_tasks_user_id ON tasks(user_id);
CREATE INDEX idx_tasks_created_at ON tasks(created_at DESC);
CREATE INDEX idx_tasks_completed ON tasks(completed) WHERE completed = false;

-- ============================================================
-- Conversations Table
-- ============================================================
CREATE TABLE conversations (
    id VARCHAR(255) PRIMARY KEY,
    user_id VARCHAR(255) NOT NULL REFERENCES users(id) ON DELETE CASCADE,
    title VARCHAR(255) DEFAULT 'New Chat',
    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
    updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

CREATE INDEX idx_conversations_user_id ON conversations(user_id);
CREATE INDEX idx_conversations_updated_at ON conversations(updated_at DESC);

-- ============================================================
-- Messages Table
-- ============================================================
CREATE TABLE messages (
    id VARCHAR(255) PRIMARY KEY,
    conversation_id VARCHAR(255) NOT NULL REFERENCES conversations(id) ON DELETE CASCADE,
    user_id VARCHAR(255) NOT NULL REFERENCES users(id) ON DELETE CASCADE,
    role VARCHAR(20) NOT NULL CHECK (role IN ('user', 'assistant')),
    content TEXT NOT NULL,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

CREATE INDEX idx_messages_conversation_id ON messages(conversation_id);
CREATE INDEX idx_messages_created_at ON messages(created_at DESC);
CREATE INDEX idx_messages_conversation_created ON messages(conversation_id, created_at DESC);
CREATE INDEX idx_messages_role ON messages(role);
```

## Migration Steps

### Initial Setup

1. **Create database**: `createdb todo_ai_chatbot` or use Neon console
2. **Run schema**: Copy-paste the DDL above into your SQL client
3. **Verify**: Check that all tables and indexes were created

### Verification Queries

```sql
-- Check tables exist
SELECT table_name FROM information_schema.tables
WHERE table_schema = 'public'
ORDER BY table_name;

-- Check indexes
SELECT tablename, indexname FROM pg_indexes
WHERE schemaname = 'public'
ORDER BY tablename, indexname;

-- Verify foreign keys
SELECT
    tc.table_name,
    kcu.column_name,
    ccu.table_name AS foreign_table_name,
    ccu.column_name AS foreign_column_name
FROM information_schema.table_constraints AS tc
JOIN information_schema.key_column_usage AS kcu
    ON tc.constraint_name = kcu.constraint_name
JOIN information_schema.constraint_column_usage AS ccu
    ON ccu.constraint_name = tc.constraint_name
WHERE tc.constraint_type = 'FOREIGN KEY'
ORDER BY tc.table_name;
```

## Rollback

```sql
DROP TABLE IF EXISTS messages CASCADE;
DROP TABLE IF EXISTS conversations CASCADE;
DROP TABLE IF EXISTS tasks CASCADE;
DROP TABLE IF EXISTS users CASCADE;
```

## Performance Considerations

### Index Strategy

- **idx_tasks_user_id**: Filters tasks by user (primary query pattern)
- **idx_tasks_completed**: Quickly find pending tasks
- **idx_conversations_updated_at**: Show recent conversations first
- **idx_messages_conversation_created**: Fetch conversation history in order
- **idx_messages_role**: Filter by role if needed

### Query Patterns

**Fetch user's pending tasks**:
```sql
SELECT * FROM tasks
WHERE user_id = $1 AND completed = false
ORDER BY created_at DESC;
-- Uses: idx_tasks_user_id, idx_tasks_completed
```

**Fetch conversation history**:
```sql
SELECT * FROM messages
WHERE conversation_id = $1
ORDER BY created_at ASC
LIMIT 50;
-- Uses: idx_messages_conversation_created
```

**Count user's tasks**:
```sql
SELECT COUNT(*) FROM tasks WHERE user_id = $1;
-- Uses: idx_tasks_user_id
```

## Data Retention

Per spec assumptions:
- No automatic archival or cleanup
- Tasks, conversations, messages retained indefinitely unless explicitly deleted
- Manual cleanup via DELETE operations only

## Cascade Rules Summary

| Parent | Child | On Delete |
|--------|-------|-----------|
| users | tasks | CASCADE |
| users | conversations | CASCADE |
| users | messages | CASCADE |
| conversations | messages | CASCADE |

Deleting a user automatically deletes all their data.
